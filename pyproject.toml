[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pocketdex-mcp"
version = "0.2.0"
description = "A tiny local code index served over MCP, built on SQLite FTS5"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Sujal Kumar" }]
keywords = ["mcp", "code-search", "sqlite", "fts5", "ai-agents", "llm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries",
    "Topic :: Text Processing :: Indexing",
]

[project.urls]
Homepage = "https://github.com/sujalkumar1029-gif/pocketdex-mcp"
Issues = "https://github.com/sujalkumar1029-gif/pocketdex-mcp/issues"

[project.scripts]
pocketdex = "pocketdex:main"

[tool.setuptools]
py-modules = ["pocketdex"]
